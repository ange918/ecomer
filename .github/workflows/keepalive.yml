name: Keep Supabase awake

# Empêche la mise en veille automatique du projet Supabase (offre gratuite :
# pause après ~7 jours sans activité). On envoie une requête légère tous les
# 3 jours pour garder le projet actif.

on:
  schedule:
    - cron: '17 7 */3 * *' # tous les 3 jours, 07:17 UTC
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST
        env:
          SUPABASE_URL: https://gyuuvododjhfuckadzji.supabase.co
          # Clé publique (« publishable ») — conçue pour être exposée, protégée par RLS.
          SUPABASE_KEY: sb_publishable_RR2kBUlk5LVT-gaGMTwvNQ_koNmGj9K
        run: |
          code=$(curl -sS -o /dev/null -w "%{http_code}" \
            "$SUPABASE_URL/rest/v1/orders?select=id&limit=1" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY")
          echo "Réponse Supabase : HTTP $code"
          if [ "$code" = "000" ]; then
            echo "::error::Projet Supabase injoignable"
            exit 1
          fi
